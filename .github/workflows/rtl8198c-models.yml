name: RTL8198C GN866 LG7100 SK337 build

on:
  push:
    branches:
      - rtl8198c-gn866-lg7100-sk337
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GN866_AC
            config: configs/rtl8198c_gn866_ac
          - name: LG7100
            config: configs/rtl8198c_lg7100
          - name: SK337
            config: configs/rtl8198c_sk337
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rtl8198c-gn866-lg7100-sk337

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp "${{ matrix.config }}" .config
          make defconfig

      - name: Build
        run: |
          make -j2 V=s

      - name: Verify firmware
        run: |
          set -eu
          echo "=== ${{ matrix.name }} images ==="
          find bin -type f -name '*.bin' -printf '%p %s bytes\n' | sort
          case "${{ matrix.name }}" in
            GN866_AC)
              find bin -type f -name '*GN866_AC*fw.bin' | grep -q .
              ;;
            LG7100)
              find bin -type f -name '*LG7100*fw.bin' | grep -q .
              ;;
            SK337)
              find bin -type f -name '*SK337*fw.bin' | grep -q .
              ;;
          esac

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RTL8198C-${{ matrix.name }}
          path: |
            bin/**/*.bin
            bin/**/*.sha256
          if-no-files-found: error
